<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" width="400" height="390" role="img" aria-labelledby="t">
  <title id="t">Isometric illustration of layered development stack</title>
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="faceBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/><stop offset="1" stop-color="#f5d0fe"/>
    </linearGradient>
    <linearGradient id="sideL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="sideR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#c7d2fe"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="345" rx="190" ry="42" fill="url(#glow)"/>

  <!-- Base layer -->
  <polygon points="40,250 200,330 200,352 40,272" fill="url(#sideL)"/>
  <polygon points="200,330 360,250 360,272 200,352" fill="url(#sideR)"/>
  <polygon points="200,170 360,250 200,330 40,250" fill="url(#faceBase)" stroke="#fff" stroke-opacity=".7"/>
  <g transform="matrix(1 .5 -1 .5 200 170)">
    <g fill="none" stroke="url(#brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 150 H100 V110 H150"/>
      <path d="M150 40 V90 H110 V140"/>
      <path d="M20 135 H60"/>
    </g>
    <g fill="#4f46e5">
      <rect x="18" y="104" width="20" height="20" rx="3"/>
      <rect x="120" y="18" width="20" height="20" rx="3"/>
      <rect x="112" y="112" width="24" height="24" rx="4" fill="url(#brand)"/>
    </g>
  </g>

  <!-- Pillars: base to middle -->
  <g>
    <rect x="94" y="195" width="12" height="55" fill="url(#pillar)"/>
    <ellipse cx="100" cy="250" rx="9" ry="4.5" fill="#4338ca"/>
    <rect x="294" y="195" width="12" height="55" fill="url(#pillar)"/>
    <ellipse cx="300" cy="250" rx="9" ry="4.5" fill="#4338ca"/>
  </g>

  <!-- Middle layer -->
  <polygon points="70,180 200,245 200,259 70,194" fill="url(#sideL)"/>
  <polygon points="200,245 330,180 330,194 200,259" fill="url(#sideR)"/>
  <polygon points="200,115 330,180 200,245 70,180" fill="url(#faceTop)" stroke="#fff" stroke-opacity=".7"/>
  <g transform="matrix(1 .5 -1 .5 200 115)">
    <circle cx="85" cy="85" r="26" fill="none" stroke="url(#brand)" stroke-width="5"/>
    <circle cx="85" cy="85" r="11" fill="#fff" fill-opacity=".8"/>
    <g fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 105 H55 V125"/>
      <path d="M115 20 V50 H128"/>
    </g>
    <rect x="102" y="98" width="18" height="18" rx="3" fill="#6366f1"/>
    <circle cx="22" cy="40" r="4" fill="url(#brand)"/>
    <circle cx="38" cy="30" r="4" fill="#6366f1"/>
  </g>

  <!-- Pillars: middle to top -->
  <g>
    <rect x="124" y="125" width="12" height="55" fill="url(#pillar)"/>
    <ellipse cx="130" cy="180" rx="9" ry="4.5" fill="#4338ca"/>
    <rect x="264" y="125" width="12" height="55" fill="url(#pillar)"/>
    <ellipse cx="270" cy="180" rx="9" ry="4.5" fill="#4338ca"/>
  </g>

  <!-- Top layer -->
  <polygon points="100,110 200,160 200,172 100,122" fill="url(#sideL)"/>
  <polygon points="200,160 300,110 300,122 200,172" fill="url(#sideR)"/>
  <polygon points="200,60 300,110 200,160 100,110" fill="url(#faceTop)" stroke="#fff" stroke-opacity=".8"/>
  <g transform="matrix(1 .5 -1 .5 200 60)">
    <rect x="28" y="28" width="44" height="44" rx="9" fill="url(#brand)" stroke="#fff" stroke-width="2"/>
    <text x="50" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#fff">Aa</text>
    <g fill="#6366f1">
      <circle cx="14" cy="82" r="3.5"/>
      <circle cx="26" cy="88" r="3.5" fill="#ec4899"/>
      <circle cx="38" cy="94" r="3.5" fill="#f97316"/>
    </g>
    <g fill="#fff" fill-opacity=".85">
      <rect x="78" y="18" width="16" height="6" rx="3"/>
      <rect x="78" y="30" width="10" height="6" rx="3"/>
    </g>
  </g>
</svg>
